               function searchPlanet() {
    const search = document.getElementById("planetSearch").value

        mercury: "mercury.html",
        venus: "venus.html",
        earth: "earth.html",
        mars: "mars.html",
        jupiter: "jupiter.html",
        saturn: "saturn.html",
        uranus: "uranus.html",
        neptune: "neptune.html",
        pluto: "pluto.html"
    };

    if (planets[search]) {
        window.location.href = planets[search];
    } else {
        alert("Planet not found!");
    }
}
